name: Non-minimal section search
on:
  push:
    branches: [research/nonminimal-sections-20261116]
    paths:
      - '.github/workflows/nonminimal-section-search.yml'
      - 'research/nonminimal_sections_20261116/**'
      - 'research/lower_bound_search_20261114/broad_dimensions_followup/ambient48.npz'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-and-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Inspect ambient certificate inputs
        run: python research/nonminimal_sections_20261116/search.py
